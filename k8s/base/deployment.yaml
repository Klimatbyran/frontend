apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/klimatbyran/frontend
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  MAIN=$(grep -oE 'src="/assets/index-[^"]+\.js"' /usr/share/nginx/html/index.html | head -1 | sed 's/src="//;s/"//')
                  test -n "$MAIN" && test -f "/usr/share/nginx/html$MAIN"
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: VITE_NODE_ENV
              value: "staging"
            - name: GARBO_ALL_ACCESS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: env
                  key: GARBO_ALL_ACCESS_API_KEY
