<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klimatkollen · Detail page mockups</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#">Klimatkollen</a>
      <nav class="entity-switch" aria-label="Mockup variants">
        <button class="entity-tab is-active" data-entity="municipality" type="button">
          Municipality
        </button>
        <button class="entity-tab" data-entity="region" type="button">Region</button>
        <button class="entity-tab" data-entity="company" type="button">Company</button>
      </nav>
      <p class="mock-badge">Mockup. Not live data.</p>
    </header>

    <main id="app" class="page"></main>

    <template id="tpl-municipality">
      <article class="story">
        <section class="hero">
          <p class="entity-type">Municipality in Västerbotten</p>
          <h1 class="entity-name">Umeå</h1>
          <p class="meta">S + MP + V. Climate plan from 2022. About 132,000 residents.</p>
          <p class="verdict accent-pink">Not on track for Paris</p>
          <p class="lede">
            On Klimatkollen the Paris goal means about 12% less each year, from 2025.
            Umeå is closer to 3%.
          </p>
          <nav class="q-nav">
            <a href="#past">Historically</a>
            <a href="#future">The trend</a>
            <a href="#paris">Paris goal</a>
          </nav>
        </section>

        <section class="block" id="past">
          <p class="question">How has it gone with emissions historically?</p>
          <h2 class="answer">Down 28% since 2015</h2>
          <p class="support">
            From 290,000 tonnes a year to 210,000. A bit faster than Swedish
            municipalities on average. Still not the pace Paris needs.
          </p>
          <div class="legend">
            <span><i class="swatch orange"></i> Emissions produced in Umeå</span>
            <span class="legend-unit">tonnes a year</span>
          </div>
          <div class="chart" data-series="muni-history"></div>
          <div class="stats">
            <div>
              <p class="stat-label">Per resident, produced here</p>
              <p class="stat-value">1.6 t</p>
              <p class="stat-cap">210,000 tonnes divided by 132,000 people</p>
            </div>
            <div>
              <p class="stat-label">Per resident, from consumption</p>
              <p class="stat-value accent-orange">~9 t</p>
              <p class="stat-cap">Swedish average lifestyle footprint</p>
            </div>
            <div>
              <p class="stat-label">What local politics can touch</p>
              <p class="stat-value">Transport</p>
              <p class="stat-cap">About 4 in 10 tonnes come from traffic</p>
            </div>
          </div>
          <p class="compare-title">Yearly change since 2015</p>
          <div class="compare-row">
            <span>Umeå</span>
            <div class="compare-track"><div class="bar-fill orange" style="--w: 64%"></div></div>
            <b class="accent-orange">−3.2%/year</b>
          </div>
          <div class="compare-row">
            <span>Swedish municipalities</span>
            <div class="compare-track"><div class="bar-fill grey" style="--w: 44%"></div></div>
            <b>−2.2%/year</b>
          </div>
        </section>

        <section class="block" id="future">
          <p class="question">How will it go in the future according to trends?</p>
          <h2 class="answer">If the trend holds, Umeå stays above the Paris path</h2>
          <p class="support">
            This is not a target. It is the last years, drawn forward.
            Green is about 12% less each year from 2025. The gap is extra emissions.
          </p>
          <div class="legend">
            <span><i class="swatch orange"></i> If the trend continues</span>
            <span><i class="swatch green dashed"></i> Paris path (12% less a year)</span>
            <span class="legend-unit">tonnes a year</span>
          </div>
          <div class="chart tall" data-series="muni-future"></div>
          <div class="stats">
            <div>
              <p class="stat-label">2030 on the trend</p>
              <p class="stat-value accent-orange">168,000 t</p>
              <p class="stat-cap">Still most of today’s level</p>
            </div>
            <div>
              <p class="stat-label">2030 on the Paris path</p>
              <p class="stat-value accent-green">85,000 t</p>
              <p class="stat-cap">About half of today</p>
            </div>
            <div>
              <p class="stat-label">Paris 2030 level, on this trend</p>
              <p class="stat-value accent-pink">Around 2044</p>
              <p class="stat-cap">Fourteen years late</p>
            </div>
          </div>
        </section>

        <section class="block" id="paris">
          <p class="question">Is it aligned with the Paris goal?</p>
          <h2 class="answer accent-pink">No. The trend uses more than twice the budget.</h2>
          <p class="support">
            We add up emissions from 2025 to 2050 on the trend.
            Then we compare that total with a 12% yearly cut.
            The lines do not have to match each year. The total does.
          </p>
          <p class="compare-title">Total emissions 2025–2050</p>
          <div class="compare-row">
            <span>Paris goal allows</span>
            <div class="compare-track"><div class="bar-fill green" style="--w: 42%"></div></div>
            <b>1.8 million t</b>
          </div>
          <div class="compare-row">
            <span>If the trend continues</span>
            <div class="compare-track"><div class="bar-fill pink" style="--w: 100%"></div></div>
            <b class="accent-pink">4.3 million t</b>
          </div>
          <p class="support tight">
            4.3 million tonnes is about 20 years of today’s Umeå emissions.
            Paris leaves room for about 8 years at today’s level.
          </p>
          <div class="stats">
            <div>
              <p class="stat-label">Recent trend</p>
              <p class="stat-value accent-orange">−3%</p>
              <p class="stat-cap">per year</p>
            </div>
            <div>
              <p class="stat-label">Paris goal</p>
              <p class="stat-value accent-green">−12%</p>
              <p class="stat-cap">per year</p>
            </div>
          </div>
        </section>
      </article>
    </template>

    <template id="tpl-region">
      <article class="story">
        <section class="hero">
          <p class="entity-type">Region. 49 municipalities.</p>
          <h1 class="entity-name">Västra Götaland</h1>
          <p class="meta">About 1.8 million residents. One fifth of Sweden’s population.</p>
          <p class="verdict accent-green">On track for Paris, if the trend holds</p>
          <p class="lede">
            Emissions have fallen fast enough. The projected total still fits
            the Paris budget: about 12% less each year from 2025.
          </p>
          <nav class="q-nav">
            <a href="#past">Historically</a>
            <a href="#future">The trend</a>
            <a href="#paris">Paris goal</a>
          </nav>
        </section>

        <section class="block" id="past">
          <p class="question">How has it gone with emissions historically?</p>
          <h2 class="answer">Almost halved since 1990</h2>
          <p class="support">
            From 18 million tonnes a year to 11 million.
            A bigger drop than Sweden as a whole over the same period.
          </p>
          <div class="legend">
            <span><i class="swatch orange"></i> Regional emissions</span>
            <span class="legend-unit">million tonnes a year</span>
          </div>
          <div class="chart" data-series="region-history"></div>
          <div class="stats">
            <div>
              <p class="stat-label">Share of Sweden’s emissions</p>
              <p class="stat-value">~20%</p>
              <p class="stat-cap">In line with its share of population</p>
            </div>
            <div>
              <p class="stat-label">Per resident, produced here</p>
              <p class="stat-value accent-green">6 t</p>
              <p class="stat-cap">11 million tonnes divided by 1.8 million people</p>
            </div>
            <div>
              <p class="stat-label">Change since 1990</p>
              <p class="stat-value accent-green">−41%</p>
              <p class="stat-cap">Sweden overall is closer to −35%</p>
            </div>
          </div>
        </section>

        <section class="block" id="future">
          <p class="question">How will it go in the future according to trends?</p>
          <h2 class="answer">The trend keeps falling. It does not have to sit on the green line.</h2>
          <p class="support">
            This is the recent trend, not a regional climate plan.
            Green is the 12% path. What counts later is the total, not 12% every year.
          </p>
          <div class="legend">
            <span><i class="swatch orange"></i> If the trend continues</span>
            <span><i class="swatch green dashed"></i> Paris path (12% less a year)</span>
            <span class="legend-unit">million tonnes a year</span>
          </div>
          <div class="chart tall" data-series="region-future"></div>
          <div class="stats">
            <div>
              <p class="stat-label">2030 on the trend</p>
              <p class="stat-value accent-green">6.9 million t</p>
              <p class="stat-cap">Down from 10.7 today</p>
            </div>
            <div>
              <p class="stat-label">2030 on the Paris path</p>
              <p class="stat-value">4.4 million t</p>
              <p class="stat-cap">The reference curve is steeper</p>
            </div>
            <div>
              <p class="stat-label">Why it can still be on track</p>
              <p class="stat-value">The total</p>
              <p class="stat-cap">Steady cuts in tonnes can still fit the budget</p>
            </div>
          </div>
        </section>

        <section class="block" id="paris">
          <p class="question">Is it aligned with the Paris goal?</p>
          <h2 class="answer accent-green">Yes. The projected total fits the budget.</h2>
          <p class="support">
            Same test as for municipalities. Add up 2025 to 2050 on the trend.
            Compare with a 12% yearly cut.
          </p>
          <p class="compare-title">Total emissions 2025–2050</p>
          <div class="compare-row">
            <span>Paris goal allows</span>
            <div class="compare-track"><div class="bar-fill green" style="--w: 100%"></div></div>
            <b>95 million t</b>
          </div>
          <div class="compare-row">
            <span>If the trend continues</span>
            <div class="compare-track"><div class="bar-fill orange" style="--w: 78%"></div></div>
            <b class="accent-green">74 million t</b>
          </div>
          <p class="support tight">
            About 21 million tonnes of room left. Roughly two years of today’s
            regional emissions.
          </p>
          <p class="compare-title">Municipalities. Yearly change.</p>
          <div class="compare-row">
            <span>Göteborg</span>
            <div class="compare-track"><div class="bar-fill green" style="--w: 80%"></div></div>
            <b class="accent-green">−4.8%</b>
          </div>
          <div class="compare-row">
            <span>Borås</span>
            <div class="compare-track"><div class="bar-fill green" style="--w: 52%"></div></div>
            <b class="accent-green">−3.1%</b>
          </div>
          <div class="compare-row">
            <span>Trollhättan</span>
            <div class="compare-track"><div class="bar-fill orange" style="--w: 23%"></div></div>
            <b class="accent-orange">−1.4%</b>
          </div>
          <div class="compare-row">
            <span>Skövde</span>
            <div class="compare-track"><div class="bar-fill pink" style="--w: 10%"></div></div>
            <b class="accent-pink">+0.6%</b>
          </div>
        </section>
      </article>
    </template>

    <template id="tpl-company">
      <article class="story">
        <section class="hero">
          <p class="entity-type">Company. Vehicles and machinery.</p>
          <h1 class="entity-name">Volvo Group</h1>
          <p class="meta">Listed in Sweden. Most of the climate impact sits in the trucks on the road.</p>
          <p class="verdict accent-pink">Not on track for Paris</p>
          <p class="lede">
            Same rule as for cities. The trend should fit a 12% yearly cut through 2050.
            Volvo’s reported trend does not.
          </p>
          <nav class="q-nav">
            <a href="#past">Historically</a>
            <a href="#future">The trend</a>
            <a href="#paris">Paris goal</a>
          </nav>
        </section>

        <section class="block" id="past">
          <p class="question">How has it gone with emissions historically?</p>
          <h2 class="answer">Totals dipped, then flattened. Almost all of it is the value chain.</h2>
          <p class="support">
            Latest year: about 38 million tonnes. In the same ballpark as all of
            Sweden’s territorial emissions. That is because it includes trucks
            sold and driven worldwide.
          </p>
          <div class="legend">
            <span><i class="swatch orange"></i> Own operations</span>
            <span><i class="swatch blue"></i> Value chain (mostly vehicles in use)</span>
          </div>
          <div class="chart" data-series="company-past"></div>
          <div class="stats">
            <div>
              <p class="stat-label">Latest total</p>
              <p class="stat-value accent-orange">38 million t</p>
              <p class="stat-cap">About Sweden’s yearly territorial emissions</p>
            </div>
            <div>
              <p class="stat-label">Vs last year</p>
              <p class="stat-value accent-pink">+1.2%</p>
              <p class="stat-cap">A rise, not a cut</p>
            </div>
            <div>
              <p class="stat-label">From the value chain</p>
              <p class="stat-value">~97%</p>
              <p class="stat-cap">Own operations are the thin orange slice</p>
            </div>
          </div>
        </section>

        <section class="block" id="future">
          <p class="question">How will it go in the future according to trends?</p>
          <h2 class="answer">The reported trend barely falls. The Paris path drops away.</h2>
          <p class="support">
            Orange is the last years, drawn forward. Not Volvo’s official target.
            The gap is extra climate impact still to cut.
          </p>
          <div class="legend">
            <span><i class="swatch orange"></i> If the trend continues</span>
            <span><i class="swatch green dashed"></i> Paris path (12% less a year)</span>
            <span class="legend-unit">million tonnes a year</span>
          </div>
          <div class="chart tall" data-series="company-future"></div>
          <div class="stats">
            <div>
              <p class="stat-label">2030 on the trend</p>
              <p class="stat-value accent-pink">36 million t</p>
              <p class="stat-cap">Almost unchanged</p>
            </div>
            <div>
              <p class="stat-label">2030 on the Paris path</p>
              <p class="stat-value accent-green">18 million t</p>
              <p class="stat-cap">About half of today</p>
            </div>
            <div>
              <p class="stat-label">Last year’s rise, in context</p>
              <p class="stat-value">4,500</p>
              <p class="stat-cap">Round trips Stockholm to New York</p>
            </div>
          </div>
        </section>

        <section class="block" id="paris">
          <p class="question">Is it aligned with the Paris goal?</p>
          <h2 class="answer accent-pink">No. About three times the budget.</h2>
          <p class="support">
            Add up 2025 to 2050 on the trend. Compare with a 12% yearly cut.
          </p>
          <p class="compare-title">Total emissions 2025–2050</p>
          <div class="compare-row">
            <span>Paris goal allows</span>
            <div class="compare-track"><div class="bar-fill green" style="--w: 35%"></div></div>
            <b>210 million t</b>
          </div>
          <div class="compare-row">
            <span>If the trend continues</span>
            <div class="compare-track"><div class="bar-fill pink" style="--w: 100%"></div></div>
            <b class="accent-pink">610 million t</b>
          </div>
          <p class="support tight">
            610 million tonnes is about 16 years of today’s Volvo emissions.
            Paris leaves room for about 5 years at today’s level.
          </p>
          <div class="stats">
            <div>
              <p class="stat-label">Reported trend</p>
              <p class="stat-value accent-pink">−1%</p>
              <p class="stat-cap">per year</p>
            </div>
            <div>
              <p class="stat-label">Paris goal</p>
              <p class="stat-value accent-green">−12%</p>
              <p class="stat-cap">per year</p>
            </div>
          </div>
        </section>
      </article>
    </template>

    <script src="./mockup.js"></script>
  </body>
</html>
