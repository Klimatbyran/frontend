<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klimatkollen — Detail page redesign mockups</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#">Klimatkollen</a>
      <nav class="entity-switch" aria-label="Mockup variants">
        <button class="entity-tab is-active" data-entity="municipality" type="button">
          Municipality
        </button>
        <button class="entity-tab" data-entity="region" type="button">Region</button>
        <button class="entity-tab" data-entity="company" type="button">Company</button>
      </nav>
      <p class="mock-badge">Design mockup · not live data</p>
    </header>

    <main id="app" class="page"></main>

    <template id="tpl-municipality">
      <article class="story" data-status="off">
        <section class="hero">
          <p class="entity-type">Municipality in Västerbotten</p>
          <h1 class="entity-name">Umeå</h1>
          <div class="verdict verdict-off">
            <p class="verdict-kicker">The short answer</p>
            <p class="verdict-answer">Not on track for Paris</p>
            <p class="verdict-explain">
              Emissions need to fall by about <strong>12% every year</strong>.
              Umeå is closer to <strong>3% a year</strong> — progress, but too
              slow for the remaining allowance to 2050.
            </p>
          </div>
          <div class="snapshots" aria-label="The three questions">
            <a class="snapshot snapshot-warn" href="#past">
              <span class="snapshot-q">In the past?</span>
              <span class="snapshot-a">Down 28% since 2015</span>
            </a>
            <a class="snapshot snapshot-warn" href="#future">
              <span class="snapshot-q">In the future?</span>
              <span class="snapshot-a">Still far from −12%/year</span>
            </a>
            <a class="snapshot snapshot-off" href="#paris">
              <span class="snapshot-q">Paris aligned?</span>
              <span class="snapshot-a">No</span>
            </a>
          </div>
        </section>

        <section class="block" id="story-chart">
          <header class="block-head">
            <p class="question">The whole picture</p>
            <h2 class="answer">History, today’s path, and the Paris path — on one timeline</h2>
            <p class="support">
              Orange is what actually happened, then “if we keep going.”
              Green is the Paris path: about <strong>12% less each year</strong> from 2025.
              The space between the lines is extra emissions.
            </p>
          </header>
          <div class="viz-panel">
            <div class="legend">
              <span><i class="swatch orange"></i> Emissions so far, then current trend</span>
              <span><i class="swatch green dashed"></i> Paris path (−12%/year)</span>
              <span class="legend-unit">thousand tonnes a year</span>
            </div>
            <div class="chart story" data-chart="story" data-series="muni-story"></div>
            <p class="chart-caption">
              The grey line marks today. After that, two futures split apart.
            </p>
          </div>
        </section>

        <section class="block" id="past">
          <header class="block-head">
            <p class="question">How has it gone with emissions?</p>
            <h2 class="answer">They have come down — slowly</h2>
            <p class="support">
              Local emissions fell from about <strong>290,000 tonnes a year</strong>
              in 2015 to about <strong>210,000 tonnes</strong> in 2023.
              That is real progress. It is not a steep drop.
            </p>
          </header>
          <div class="callout-grid">
            <div class="stat-card">
              <span class="callout-label">2015</span>
              <span class="callout-value">290,000 t</span>
              <span class="callout-hint">tonnes of CO₂ a year</span>
            </div>
            <div class="stat-card">
              <span class="callout-label">2023</span>
              <span class="callout-value accent-orange">210,000 t</span>
              <span class="callout-hint">latest year we have</span>
            </div>
            <div class="stat-card">
              <span class="callout-label">Change</span>
              <span class="callout-value accent-orange">−28%</span>
              <span class="callout-hint">over eight years</span>
            </div>
          </div>
        </section>

        <section class="block" id="future">
          <header class="block-head">
            <p class="question">How is it going in the future?</p>
            <h2 class="answer">If nothing changes, Umeå stays well above the Paris path</h2>
            <p class="support">
              Think of it as speed. Paris asks for a fast yearly cut.
              Umeå’s current speed is much slower.
            </p>
          </header>
          <div class="pace-grid">
            <div class="pace-card">
              <p class="pace-label">Umeå is doing about</p>
              <p class="pace-value accent-orange">−3%</p>
              <p class="pace-unit">per year</p>
              <div class="pace-bar"><span style="--w: 25%" class="fill-orange"></span></div>
            </div>
            <div class="pace-card">
              <p class="pace-label">Paris needs about</p>
              <p class="pace-value accent-green">−12%</p>
              <p class="pace-unit">per year</p>
              <div class="pace-bar"><span style="--w: 100%" class="fill-green"></span></div>
            </div>
          </div>
        </section>

        <section class="block" id="paris">
          <header class="block-head">
            <p class="question">Is Umeå Paris aligned?</p>
            <h2 class="answer accent-pink">No — the remaining allowance would be overspent</h2>
            <p class="support">
              Alignment is not “does every year match −12%?” It is: if today’s
              trend continues to 2050, does the <strong>total</strong> fit in
              the allowance from a 12% yearly cut?
            </p>
          </header>
          <div class="viz-panel budget">
            <p class="budget-intro">Total emissions 2025–2050</p>
            <div class="budget-bars">
              <div class="budget-row">
                <span class="budget-label">Allowed (Paris)</span>
                <div class="bar-track">
                  <div class="bar-fill green" style="--w: 42%"></div>
                </div>
                <span class="budget-num">1.8 million t</span>
              </div>
              <div class="budget-row">
                <span class="budget-label">If we continue</span>
                <div class="bar-track">
                  <div class="bar-fill pink" style="--w: 100%"></div>
                </div>
                <span class="budget-num">4.3 million t</span>
              </div>
            </div>
            <p class="budget-verdict">
              Umeå is heading for <strong>more than twice</strong> what Paris allows,
              unless cuts get faster.
            </p>
          </div>
        </section>

        <section class="block secondary">
          <header class="block-head">
            <p class="question">Where do the emissions come from?</p>
            <h2 class="answer">Mostly from transport</h2>
            <p class="support">
              This is the latest year, split by source. Bigger bar = bigger share.
            </p>
          </header>
          <div class="viz-panel">
            <div class="source-bars">
              <div class="source-bar">
                <span>Transport</span>
                <div class="mini-track"><div style="--w: 41%; --c: var(--orange-3)"></div></div>
                <b>41%</b>
              </div>
              <div class="source-bar">
                <span>Industry</span>
                <div class="mini-track"><div style="--w: 24%; --c: var(--blue-3)"></div></div>
                <b>24%</b>
              </div>
              <div class="source-bar">
                <span>Agriculture</span>
                <div class="mini-track"><div style="--w: 18%; --c: var(--blue-2)"></div></div>
                <b>18%</b>
              </div>
              <div class="source-bar">
                <span>Everything else</span>
                <div class="mini-track"><div style="--w: 17%; --c: var(--grey)"></div></div>
                <b>17%</b>
              </div>
            </div>
          </div>
        </section>
      </article>
    </template>

    <template id="tpl-region">
      <article class="story" data-status="on">
        <section class="hero">
          <p class="entity-type">Region</p>
          <h1 class="entity-name">Västra Götaland</h1>
          <div class="verdict verdict-on">
            <p class="verdict-kicker">The short answer</p>
            <p class="verdict-answer">On track for Paris</p>
            <p class="verdict-explain">
              Emissions have fallen fast enough that the projected path still
              fits inside the Paris allowance — a cut of about
              <strong>12% a year</strong> from 2025.
            </p>
          </div>
          <div class="snapshots" aria-label="The three questions">
            <a class="snapshot snapshot-ok" href="#past">
              <span class="snapshot-q">In the past?</span>
              <span class="snapshot-a">Down 41% since 1990</span>
            </a>
            <a class="snapshot snapshot-ok" href="#future">
              <span class="snapshot-q">In the future?</span>
              <span class="snapshot-a">Pace is close enough</span>
            </a>
            <a class="snapshot snapshot-on" href="#paris">
              <span class="snapshot-q">Paris aligned?</span>
              <span class="snapshot-a">Yes</span>
            </a>
          </div>
        </section>

        <section class="block" id="story-chart">
          <header class="block-head">
            <p class="question">The whole picture</p>
            <h2 class="answer">A long decline — and a future that still fits the allowance</h2>
            <p class="support">
              Green does not have to sit on top of orange every year.
              What counts is whether the <strong>total</strong> from 2025 to 2050
              stays inside the Paris allowance.
            </p>
          </header>
          <div class="viz-panel">
            <div class="legend">
              <span><i class="swatch orange"></i> Emissions so far, then current trend</span>
              <span><i class="swatch green dashed"></i> Paris path (−12%/year)</span>
              <span class="legend-unit">million tonnes a year</span>
            </div>
            <div class="chart story" data-chart="story" data-series="region-story"></div>
            <p class="chart-caption">
              The two futures both fall. The orange path is high enough in early
              years, but the total still fits.
            </p>
          </div>
        </section>

        <section class="block" id="past">
          <header class="block-head">
            <p class="question">How has it gone with emissions?</p>
            <h2 class="answer">Almost halved since 1990</h2>
            <p class="support">
              From about <strong>18 million tonnes a year</strong> down to about
              <strong>11 million</strong>. The hard part now is keeping that
              pace as the easy wins run out.
            </p>
          </header>
          <div class="callout-grid">
            <div class="stat-card">
              <span class="callout-label">1990</span>
              <span class="callout-value">18 million t</span>
              <span class="callout-hint">tonnes of CO₂ a year</span>
            </div>
            <div class="stat-card">
              <span class="callout-label">2023</span>
              <span class="callout-value accent-green">11 million t</span>
              <span class="callout-hint">latest year we have</span>
            </div>
            <div class="stat-card">
              <span class="callout-label">Change</span>
              <span class="callout-value accent-green">−41%</span>
              <span class="callout-hint">over three decades</span>
            </div>
          </div>
        </section>

        <section class="block" id="future">
          <header class="block-head">
            <p class="question">How is it going in the future?</p>
            <h2 class="answer">The yearly % is lower than 12% — and that can still be enough</h2>
            <p class="support">
              A steady cut in tonnes can still clear the allowance, even if the
              early percentage looks smaller than 12%. The chart above is the
              picture; these numbers are the speed.
            </p>
          </header>
          <div class="pace-grid">
            <div class="pace-card">
              <p class="pace-label">Region is doing about</p>
              <p class="pace-value accent-green">−6%</p>
              <p class="pace-unit">per year</p>
              <div class="pace-bar"><span style="--w: 50%" class="fill-green"></span></div>
            </div>
            <div class="pace-card">
              <p class="pace-label">Paris needs about</p>
              <p class="pace-value accent-green">−12%</p>
              <p class="pace-unit">per year</p>
              <div class="pace-bar"><span style="--w: 100%" class="fill-green"></span></div>
            </div>
          </div>
        </section>

        <section class="block" id="paris">
          <header class="block-head">
            <p class="question">Is Västra Götaland Paris aligned?</p>
            <h2 class="answer accent-green">Yes — the projected total fits the allowance</h2>
            <p class="support">
              Add up emissions from 2025 to 2050 on the current trend.
              That total is still under the Paris allowance.
            </p>
          </header>
          <div class="viz-panel budget">
            <p class="budget-intro">Total emissions 2025–2050</p>
            <div class="budget-bars">
              <div class="budget-row">
                <span class="budget-label">Allowed (Paris)</span>
                <div class="bar-track">
                  <div class="bar-fill green" style="--w: 100%"></div>
                </div>
                <span class="budget-num">95 million t</span>
              </div>
              <div class="budget-row">
                <span class="budget-label">If we continue</span>
                <div class="bar-track">
                  <div class="bar-fill orange" style="--w: 78%"></div>
                </div>
                <span class="budget-num">74 million t</span>
              </div>
            </div>
            <p class="budget-verdict">
              About <strong>one fifth of room</strong> remains under the
              allowance if today’s pace continues.
            </p>
          </div>
        </section>

        <section class="block secondary">
          <header class="block-head">
            <p class="question">How do municipalities compare?</p>
            <h2 class="answer">Most are cutting — a few are still rising</h2>
            <p class="support">Yearly change in local emissions. Green means falling.</p>
          </header>
          <div class="viz-panel">
            <div class="source-bars">
              <div class="source-bar">
                <span>Göteborg</span>
                <div class="mini-track"><div style="--w: 80%; --c: var(--green-3)"></div></div>
                <b class="accent-green">−4.8%</b>
              </div>
              <div class="source-bar">
                <span>Borås</span>
                <div class="mini-track"><div style="--w: 52%; --c: var(--green-3)"></div></div>
                <b class="accent-green">−3.1%</b>
              </div>
              <div class="source-bar">
                <span>Trollhättan</span>
                <div class="mini-track"><div style="--w: 23%; --c: var(--orange-2)"></div></div>
                <b class="accent-orange">−1.4%</b>
              </div>
              <div class="source-bar">
                <span>Skövde</span>
                <div class="mini-track"><div style="--w: 10%; --c: var(--pink-3)"></div></div>
                <b class="accent-pink">+0.6%</b>
              </div>
            </div>
          </div>
        </section>
      </article>
    </template>

    <template id="tpl-company">
      <article class="story" data-status="off">
        <section class="hero">
          <p class="entity-type">Company · vehicles and machinery</p>
          <h1 class="entity-name">Volvo Group</h1>
          <div class="verdict verdict-off">
            <p class="verdict-kicker">The short answer</p>
            <p class="verdict-answer">Not on track for Paris</p>
            <p class="verdict-explain">
              Same rule as for cities: future emissions need to fall about
              <strong>12% every year</strong>. Volvo’s reported trend does not
              yet fit that allowance through 2050.
            </p>
          </div>
          <div class="snapshots" aria-label="The three questions">
            <a class="snapshot snapshot-warn" href="#past">
              <span class="snapshot-q">In the past?</span>
              <span class="snapshot-a">Dipped, then flattened</span>
            </a>
            <a class="snapshot snapshot-off" href="#future">
              <span class="snapshot-q">In the future?</span>
              <span class="snapshot-a">Trend barely falls</span>
            </a>
            <a class="snapshot snapshot-off" href="#paris">
              <span class="snapshot-q">Paris aligned?</span>
              <span class="snapshot-a">No</span>
            </a>
          </div>
        </section>

        <section class="block" id="story-chart">
          <header class="block-head">
            <p class="question">The whole picture</p>
            <h2 class="answer">Today’s path stays high. The Paris path falls away.</h2>
            <p class="support">
              Orange after today = keep reporting like this.
              Green = about <strong>12% less each year</strong>.
              The gap is the extra climate impact still to cut.
            </p>
          </header>
          <div class="viz-panel">
            <div class="legend">
              <span><i class="swatch orange"></i> Reported emissions, then current trend</span>
              <span><i class="swatch green dashed"></i> Paris path (−12%/year)</span>
              <span class="legend-unit">million tonnes a year</span>
            </div>
            <div class="chart story" data-chart="story" data-series="company-story"></div>
          </div>
        </section>

        <section class="block" id="past">
          <header class="block-head">
            <p class="question">How has it gone with emissions?</p>
            <h2 class="answer">Almost all of it sits outside the factory gates</h2>
            <p class="support">
              The thin orange slice is Volvo’s own operations.
              The tall blue bars are the value chain — mostly the vehicles in use.
              Looking only at “own” emissions hides most of the story.
            </p>
          </header>
          <div class="viz-panel">
            <div class="legend">
              <span><i class="swatch orange"></i> Own operations</span>
              <span><i class="swatch blue"></i> Value chain (suppliers + products in use)</span>
            </div>
            <div class="chart" data-chart="scopes" data-series="company-past"></div>
            <div class="callout-grid compact">
              <div class="stat-card">
                <span class="callout-label">Latest total</span>
                <span class="callout-value accent-orange">38 million t</span>
              </div>
              <div class="stat-card">
                <span class="callout-label">Vs last year</span>
                <span class="callout-value accent-pink">+1.2%</span>
              </div>
              <div class="stat-card">
                <span class="callout-label">From the value chain</span>
                <span class="callout-value">~97%</span>
              </div>
            </div>
          </div>
        </section>

        <section class="block" id="future">
          <header class="block-head">
            <p class="question">How is it going in the future?</p>
            <h2 class="answer">The needed cut is many times faster than today’s trend</h2>
          </header>
          <div class="pace-grid">
            <div class="pace-card">
              <p class="pace-label">Reported trend is about</p>
              <p class="pace-value accent-pink">−1%</p>
              <p class="pace-unit">per year</p>
              <div class="pace-bar"><span style="--w: 8%" class="fill-pink"></span></div>
            </div>
            <div class="pace-card">
              <p class="pace-label">Paris needs about</p>
              <p class="pace-value accent-green">−12%</p>
              <p class="pace-unit">per year</p>
              <div class="pace-bar"><span style="--w: 100%" class="fill-green"></span></div>
            </div>
          </div>
        </section>

        <section class="block" id="paris">
          <header class="block-head">
            <p class="question">Is Volvo Paris aligned?</p>
            <h2 class="answer accent-pink">No — the projected total overshoots the allowance</h2>
            <p class="support">
              Same test as for cities: add up 2025–2050 on the current trend,
              and compare with the allowance from a 12% yearly cut.
            </p>
          </header>
          <div class="viz-panel budget">
            <p class="budget-intro">Total emissions 2025–2050</p>
            <div class="budget-bars">
              <div class="budget-row">
                <span class="budget-label">Allowed (Paris)</span>
                <div class="bar-track">
                  <div class="bar-fill green" style="--w: 35%"></div>
                </div>
                <span class="budget-num">210 million t</span>
              </div>
              <div class="budget-row">
                <span class="budget-label">If we continue</span>
                <div class="bar-track">
                  <div class="bar-fill pink" style="--w: 100%"></div>
                </div>
                <span class="budget-num">610 million t</span>
              </div>
            </div>
            <p class="budget-verdict">
              Roughly <strong>three times</strong> the Paris allowance on the
              current path.
            </p>
          </div>
        </section>

        <section class="block secondary">
          <header class="block-head">
            <p class="question">What does last year’s rise feel like?</p>
            <h2 class="answer">Tonnes are hard to picture. These comparisons help.</h2>
          </header>
          <div class="relate-grid">
            <div class="relate-card">
              <p class="relate-value">4,500</p>
              <p class="relate-text">round-trip flights Stockholm–New York</p>
            </div>
            <div class="relate-card">
              <p class="relate-value">1 year</p>
              <p class="relate-text">of heating for a small Swedish town</p>
            </div>
            <div class="relate-card">
              <p class="relate-value">Not exact</p>
              <p class="relate-text">A feel for the size — not a precise conversion</p>
            </div>
          </div>
        </section>
      </article>
    </template>

    <script src="./mockup.js"></script>
  </body>
</html>
