<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klimatkollen · Detail page mockups</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#">Klimatkollen</a>
      <nav class="entity-switch" aria-label="Mockup variants">
        <button class="entity-tab is-active" data-entity="municipality" type="button">
          Municipality
        </button>
        <button class="entity-tab" data-entity="region" type="button">Region</button>
        <button class="entity-tab" data-entity="company" type="button">Company</button>
      </nav>
      <p class="mock-badge">Mockup. Not live data.</p>
    </header>

    <main id="app" class="page"></main>

    <template id="tpl-municipality">
      <article class="story">
        <section class="fold" id="past">
          <div class="fold-top">
            <div>
              <p class="entity-type">
                Municipality in
                <a class="place-link" href="#region" data-go="region">Västerbotten</a>
              </p>
              <h1 class="entity-name">Umeå</h1>
              <p class="meta">S + MP + V. Climate plan from 2022. About 132,000 residents.</p>
            </div>
            <div class="fold-verdict">
              <p class="verdict accent-pink">Not on track for Paris</p>
              <p class="lede">
                Paris means about 12% less each year from 2025. Umeå is closer to 3%.
                History left of Now. Trend versus Paris on the right.
              </p>
              <nav class="q-nav">
                <a href="#past">Historically</a>
                <a href="#future">The trend</a>
                <a href="#paris">Paris goal</a>
              </nav>
            </div>
          </div>
          <div class="legend">
            <span><i class="swatch orange"></i> So far, then if the trend continues</span>
            <span><i class="swatch green dashed"></i> Paris path (12% less a year)</span>
            <span class="legend-unit">tonnes a year</span>
          </div>
          <div class="chart fold-chart" data-series="muni-combined"></div>
          <div class="stats">
            <div>
              <p class="stat-label">2015</p>
              <p class="stat-value">290,000 t</p>
              <p class="stat-cap">Produced in Umeå</p>
            </div>
            <div>
              <p class="stat-label">Now</p>
              <p class="stat-value accent-orange">210,000 t</p>
              <p class="stat-cap">1.6 t per resident here. About 9 t from consumption.</p>
            </div>
            <div>
              <p class="stat-label">Yearly change vs Sweden</p>
              <p class="stat-value accent-orange">−3.2%</p>
              <p class="stat-cap">Swedish municipalities: −2.2% a year</p>
            </div>
          </div>
        </section>

        <section class="block" id="future">
          <p class="question">How will it go in the future according to trends?</p>
          <h2 class="answer">On this trend, the 2030 Paris level arrives around 2044</h2>
          <p class="support">
            Same chart as above. After Now, orange is the trend. Green is Paris.
          </p>
          <div class="stats">
            <div>
              <p class="stat-label">2030 on the trend</p>
              <p class="stat-value accent-orange">168,000 t</p>
              <p class="stat-cap">Still most of today’s level</p>
            </div>
            <div>
              <p class="stat-label">2030 on the Paris path</p>
              <p class="stat-value accent-green">85,000 t</p>
              <p class="stat-cap">About half of today</p>
            </div>
            <div>
              <p class="stat-label">What local politics can touch</p>
              <p class="stat-value">Transport</p>
              <p class="stat-cap">About 4 in 10 tonnes come from traffic</p>
            </div>
          </div>
        </section>

        <section class="block" id="paris">
          <p class="question">Is it aligned with the Paris goal?</p>
          <h2 class="answer accent-pink">No. The trend uses more than twice the budget.</h2>
          <p class="support">
            We add up emissions from 2025 to 2050 on the trend.
            Then we compare that total with a 12% yearly cut.
            The lines do not have to match each year. The total does.
          </p>
          <p class="compare-title">Total emissions 2025–2050</p>
          <div class="compare-row">
            <span>Paris goal allows</span>
            <div class="compare-track"><div class="bar-fill green" style="--w: 42%"></div></div>
            <b>1.8 million t</b>
          </div>
          <div class="compare-row">
            <span>If the trend continues</span>
            <div class="compare-track"><div class="bar-fill pink" style="--w: 100%"></div></div>
            <b class="accent-pink">4.3 million t</b>
          </div>
          <p class="support tight">
            4.3 million tonnes is about 20 years of today’s Umeå emissions.
            Paris leaves room for about 8 years at today’s level.
          </p>
          <div class="stats">
            <div>
              <p class="stat-label">Recent trend</p>
              <p class="stat-value accent-orange">−3%</p>
              <p class="stat-cap">per year</p>
            </div>
            <div>
              <p class="stat-label">Paris goal</p>
              <p class="stat-value accent-green">−12%</p>
              <p class="stat-cap">per year</p>
            </div>
          </div>
        </section>
      </article>
    </template>

    <template id="tpl-region">
      <article class="story">
        <section class="fold" id="past">
          <div class="fold-top">
            <div>
              <p class="entity-type">Region. 15 municipalities.</p>
              <h1 class="entity-name">Västerbotten</h1>
              <p class="meta">About 280,000 residents. Umeå is the largest municipality.</p>
            </div>
            <div class="fold-verdict">
              <p class="verdict accent-green">On track for Paris, if the trend holds</p>
              <p class="lede">
                Emissions have fallen fast enough. History left of Now.
                Trend versus Paris on the right.
              </p>
              <nav class="q-nav">
                <a href="#past">Historically</a>
                <a href="#future">The trend</a>
                <a href="#paris">Paris goal</a>
                <a href="#places">Municipalities</a>
              </nav>
            </div>
          </div>
          <div class="legend">
            <span><i class="swatch orange"></i> So far, then if the trend continues</span>
            <span><i class="swatch green dashed"></i> Paris path (12% less a year)</span>
            <span class="legend-unit">million tonnes a year</span>
          </div>
          <div class="chart fold-chart" data-series="region-combined"></div>
          <div class="stats">
            <div>
              <p class="stat-label">1990</p>
              <p class="stat-value">3.1 million t</p>
              <p class="stat-cap">A bigger drop than Sweden as a whole</p>
            </div>
            <div>
              <p class="stat-label">Now</p>
              <p class="stat-value accent-green">1.8 million t</p>
              <p class="stat-cap">About 6 t per resident. A small share of Sweden’s total.</p>
            </div>
            <div>
              <p class="stat-label">Change since 1990</p>
              <p class="stat-value accent-green">−42%</p>
              <p class="stat-cap">Sweden overall is closer to −35%</p>
            </div>
          </div>
        </section>

        <section class="block" id="future">
          <p class="question">How will it go in the future according to trends?</p>
          <h2 class="answer">The trend does not have to sit on the green line</h2>
          <p class="support">
            Same chart as above. This is the recent trend, not a regional climate plan.
          </p>
          <div class="stats">
            <div>
              <p class="stat-label">2030 on the trend</p>
              <p class="stat-value accent-green">1.2 million t</p>
              <p class="stat-cap">Down from 1.8 today</p>
            </div>
            <div>
              <p class="stat-label">2030 on the Paris path</p>
              <p class="stat-value">0.74 million t</p>
              <p class="stat-cap">The reference curve is steeper</p>
            </div>
            <div>
              <p class="stat-label">Why it can still be on track</p>
              <p class="stat-value">The total</p>
              <p class="stat-cap">Steady cuts in tonnes can still fit the budget</p>
            </div>
          </div>
        </section>

        <section class="block" id="paris">
          <p class="question">Is it aligned with the Paris goal?</p>
          <h2 class="answer accent-green">Yes. The projected total fits the budget.</h2>
          <p class="support">
            Same test as for municipalities. Add up 2025 to 2050 on the trend.
            Compare with a 12% yearly cut.
          </p>
          <p class="compare-title">Total emissions 2025–2050</p>
          <div class="compare-row">
            <span>Paris goal allows</span>
            <div class="compare-track"><div class="bar-fill green" style="--w: 100%"></div></div>
            <b>15 million t</b>
          </div>
          <div class="compare-row">
            <span>If the trend continues</span>
            <div class="compare-track"><div class="bar-fill orange" style="--w: 80%"></div></div>
            <b class="accent-green">12 million t</b>
          </div>
          <p class="support tight">
            About 3 million tonnes of room left. Roughly two years of today’s
            regional emissions.
          </p>
        </section>

        <section class="block" id="places">
          <p class="question">Municipalities in this region</p>
          <h2 class="answer">15 in total. Umeå is the largest.</h2>
          <p class="support">
            Yearly change for a few of them. Umeå opens the municipality page.
          </p>
          <p class="compare-title">Yearly change</p>
          <div class="compare-row">
            <a class="place-link" href="#municipality" data-go="municipality">Umeå</a>
            <div class="compare-track"><div class="bar-fill orange" style="--w: 53%"></div></div>
            <b class="accent-orange">−3.2%</b>
          </div>
          <div class="compare-row">
            <span>Skellefteå</span>
            <div class="compare-track"><div class="bar-fill green" style="--w: 80%"></div></div>
            <b class="accent-green">−4.8%</b>
          </div>
          <div class="compare-row">
            <span>Lycksele</span>
            <div class="compare-track"><div class="bar-fill orange" style="--w: 33%"></div></div>
            <b class="accent-orange">−2.0%</b>
          </div>
          <div class="compare-row">
            <span>Dorotea</span>
            <div class="compare-track"><div class="bar-fill pink" style="--w: 10%"></div></div>
            <b class="accent-pink">+0.4%</b>
          </div>
          <ul class="place-list">
            <li><a class="place-link" href="#municipality" data-go="municipality">Umeå</a></li>
            <li>Bjurholm</li>
            <li>Dorotea</li>
            <li>Lycksele</li>
            <li>Malå</li>
            <li>Nordmaling</li>
            <li>Norsjö</li>
            <li>Robertsfors</li>
            <li>Skellefteå</li>
            <li>Sorsele</li>
            <li>Storuman</li>
            <li>Vilhelmina</li>
            <li>Vindeln</li>
            <li>Vännäs</li>
            <li>Åsele</li>
          </ul>
        </section>
      </article>
    </template>

    <template id="tpl-company">
      <article class="story">
        <section class="fold" id="past">
          <div class="fold-top">
            <div>
              <p class="entity-type">Company. Vehicles and machinery.</p>
              <h1 class="entity-name">Volvo Group</h1>
              <p class="meta">Listed in Sweden. Most of the impact sits in trucks on the road.</p>
            </div>
            <div class="fold-verdict">
              <p class="verdict accent-pink">Not on track for Paris</p>
              <p class="lede">
                Same rule as for cities: about 12% less a year. The reported trend does not fit.
                History left of Now. Trend versus Paris on the right.
              </p>
              <nav class="q-nav">
                <a href="#past">Historically</a>
                <a href="#future">The trend</a>
                <a href="#paris">Paris goal</a>
              </nav>
            </div>
          </div>
          <div class="legend">
            <span><i class="swatch orange"></i> So far, then if the trend continues</span>
            <span><i class="swatch green dashed"></i> Paris path (12% less a year)</span>
            <span class="legend-unit">million tonnes a year</span>
          </div>
          <div class="chart fold-chart" data-series="company-combined"></div>
          <div class="stats">
            <div>
              <p class="stat-label">Latest total</p>
              <p class="stat-value accent-orange">38 million t</p>
              <p class="stat-cap">About Sweden’s yearly territorial emissions</p>
            </div>
            <div>
              <p class="stat-label">Vs last year</p>
              <p class="stat-value accent-pink">+1.2%</p>
              <p class="stat-cap">A rise, not a cut</p>
            </div>
            <div>
              <p class="stat-label">From the value chain</p>
              <p class="stat-value">~97%</p>
              <p class="stat-cap">Mostly trucks in use, worldwide</p>
            </div>
          </div>
        </section>

        <section class="block">
          <p class="question">Where the latest year comes from</p>
          <h2 class="answer">Almost all of it is trucks in use</h2>
          <div class="legend">
            <span><i class="swatch orange"></i> Own operations</span>
            <span><i class="swatch blue"></i> Value chain</span>
            <span class="legend-unit">million tonnes a year</span>
          </div>
          <div class="chart" data-series="company-past"></div>
        </section>

        <section class="block" id="future">
          <p class="question">How will it go in the future according to trends?</p>
          <h2 class="answer">On this trend, 2030 looks almost like today</h2>
          <p class="support">
            Same chart as above. After Now, orange stays high. Green drops away.
          </p>
          <div class="stats">
            <div>
              <p class="stat-label">2030 on the trend</p>
              <p class="stat-value accent-pink">36 million t</p>
              <p class="stat-cap">Almost unchanged</p>
            </div>
            <div>
              <p class="stat-label">2030 on the Paris path</p>
              <p class="stat-value accent-green">18 million t</p>
              <p class="stat-cap">About half of today</p>
            </div>
            <div>
              <p class="stat-label">Last year’s rise, in context</p>
              <p class="stat-value">4,500</p>
              <p class="stat-cap">Round trips Stockholm to New York</p>
            </div>
          </div>
        </section>

        <section class="block" id="paris">
          <p class="question">Is it aligned with the Paris goal?</p>
          <h2 class="answer accent-pink">No. About three times the budget.</h2>
          <p class="support">
            Add up 2025 to 2050 on the trend. Compare with a 12% yearly cut.
          </p>
          <p class="compare-title">Total emissions 2025–2050</p>
          <div class="compare-row">
            <span>Paris goal allows</span>
            <div class="compare-track"><div class="bar-fill green" style="--w: 35%"></div></div>
            <b>210 million t</b>
          </div>
          <div class="compare-row">
            <span>If the trend continues</span>
            <div class="compare-track"><div class="bar-fill pink" style="--w: 100%"></div></div>
            <b class="accent-pink">610 million t</b>
          </div>
          <p class="support tight">
            610 million tonnes is about 16 years of today’s Volvo emissions.
            Paris leaves room for about 5 years at today’s level.
          </p>
          <div class="stats">
            <div>
              <p class="stat-label">Reported trend</p>
              <p class="stat-value accent-pink">−1%</p>
              <p class="stat-cap">per year</p>
            </div>
            <div>
              <p class="stat-label">Paris goal</p>
              <p class="stat-value accent-green">−12%</p>
              <p class="stat-cap">per year</p>
            </div>
          </div>
        </section>
      </article>
    </template>

    <script src="./mockup.js"></script>
  </body>
</html>
